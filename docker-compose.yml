services:
  postgres:
    image: postgres:16-alpine
    container_name: promptlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Use ${POSTGRES_PASSWORD:?} so docker compose fails loudly if the variable is unset.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: promptlab
    ports:
      # Bind to loopback only — do not expose the DB on all network interfaces.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.2@sha256:7294b90f868c5c38c99b83021c7ba46f9b439e95f8e32964c925c7d2563a03f7
    container_name: promptlab-litellm
    restart: unless-stopped
    ports:
      # Bind to loopback only — the API reaches LiteLLM via localhost in local dev or via compose network in stack.
      - "127.0.0.1:${LITELLM_HOST_PORT:-4000}:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro

    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STORE_MODEL_IN_DB: "False"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: promptlab-api
    restart: unless-stopped
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      # The container always listens on 3100 (nginx in the web image proxies to api:3100).
      NODE_ENV: production
      PORT: "3100"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/promptlab?schema=public
      TRUST_PROXY: "1"
      LITELLM_GATEWAY_URL: http://litellm:4000
      # Load the reference prompt templates on start (idempotent). Set to "false" to start empty.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3100}:3100"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: promptlab-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-4200}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
