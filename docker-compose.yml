services:
  postgres:
    image: postgres:16-alpine
    container_name: promptlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Use ${POSTGRES_PASSWORD:?} so docker compose fails loudly if the variable is unset.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: promptlab
    ports:
      # Bind to loopback only — do not expose the DB on all network interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.40.0
    container_name: promptlab-litellm
    restart: unless-stopped
    ports:
      # Bind to loopback only — the API reaches LiteLLM via localhost; external access is not needed.
      - "127.0.0.1:4000:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      STORE_MODEL_IN_DB: "False"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - postgres

volumes:
  postgres_data:
