services:
  postgres:
    image: postgres:16-alpine
    container_name: promptlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: promptlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.40.0
    container_name: promptlab-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: sk-promptlab-dev-key
      STORE_MODEL_IN_DB: "False"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - postgres

volumes:
  postgres_data:
